apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: k8resourcesdemo-hpa        # HPA's own name
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: k8resourcesdemo          # your Deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30